<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الإدارة - Echo Creation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { slate: { 950: '#020617' } } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/admin/css/style.css">
</head>
<body class="min-h-screen bg-slate-950 flex items-center justify-center text-slate-100 font-sans p-4">
    <div id="notification-container"></div>

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 space-y-6 shadow-2xl shadow-indigo-500/10">
        <div class="text-center space-y-2">
            <div class="w-16 h-16 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <span class="text-white font-black text-2xl">E</span>
            </div>
            <h2 class="text-2xl font-bold text-white">تسجيل الدخول للإدارة</h2>
            <p class="text-sm text-slate-400">منطقة محظورة: يرجى إدخال بيانات الاعتماد</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div class="space-y-1">
                <label class="text-xs text-slate-400">اسم المستخدم (admin)</label>
                <div class="relative">
                    <input type="text" id="username" required value="admin" class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl px-4 py-3 pl-10 text-white text-sm focus:outline-none transition-all">
                    <i data-lucide="user" class="absolute left-3.5 top-3.5 w-4 h-4 text-slate-500"></i>
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-xs text-slate-400">كلمة المرور (admin123)</label>
                <div class="relative">
                    <input type="password" id="password" required value="admin123" class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl px-4 py-3 pl-10 text-white text-sm focus:outline-none transition-all">
                    <i data-lucide="lock" class="absolute left-3.5 top-3.5 w-4 h-4 text-slate-500"></i>
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-sm transition-all shadow-lg shadow-indigo-600/20 mt-2 flex items-center justify-center gap-2">
                <span>دخول للوحة التحكم</span>
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
        </form>

        <div class="text-center pt-4">
            <a href="/" class="text-xs text-slate-500 hover:text-indigo-400 transition-colors">← العودة للرئيسية</a>
        </div>
    </div>

    <script src="/admin/js/api.js"></script>
    <script src="/admin/js/admin.js"></script>
</body>
</html>
